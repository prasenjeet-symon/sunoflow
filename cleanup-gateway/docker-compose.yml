# SunoFlow cleanup gateway — one-command stack.
#
#   cp .env.example .env  &&  edit ADMIN_TOKEN and GEMINI_API_KEY
#   docker compose up -d --build
#
# Then expose it via the Cloudflare tunnel (see deploy/README.md).
# Host port 8081 is published only so the local tunnel can reach nginx.
# Nothing here is internet-facing directly.

services:
  # --- The Go gateway. Cleanup runs on Google's Gemini API, so the container
  # needs nothing but outbound HTTPS — no model host, no GPU, no local runtime.
  # The API key lives here and only here; clients never see it. ---
  gateway:
    build: .
    container_name: sunoflow-gateway
    restart: unless-stopped
    environment:
      ADMIN_TOKEN: ${ADMIN_TOKEN:?ADMIN_TOKEN is required — set it in .env}
      GATEWAY_ADDR: "0.0.0.0:8080"
      BACKEND: gemini
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required — set it in .env}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT: ${GEMINI_TIMEOUT:-20s}
      GEMINI_THINKING_LEVEL: ${GEMINI_THINKING_LEVEL:-low}
      DB_PATH: /data/keys.db
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DEFAULT_QUOTA_RPM: ${DEFAULT_QUOTA_RPM:-60}
      DEFAULT_QUOTA_DAILY: ${DEFAULT_QUOTA_DAILY:-5000}
      # Trial / subscription enforcement. Empty project = nothing enforced.
      FIREBASE_PROJECT: ${FIREBASE_PROJECT:-}
      # Signs the offline leases that bound how long a sidecar keeps working
      # without reaching us. Leave empty: the built-in default is what every
      # shipped sidecar verifies against. See deploy/ENTITLEMENT.md before
      # setting it — a mismatch invalidates every lease in the field.
      LEASE_SECRET: ${LEASE_SECRET:-}
      # Path INSIDE the container — the host file is mounted read-only below.
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:+/run/secrets/firebase.json}
    volumes:
      - gateway-data:/data
      # The service-account JSON. FIREBASE_CREDENTIALS on the host points at the
      # real path; inside the container it is always /run/secrets/firebase.json.
      # Without this mount the gateway cannot reach Firestore and refuses to
      # start, which is the loud failure we want rather than silent no-checks.
      - ${FIREBASE_CREDENTIALS:-/dev/null}:/run/secrets/firebase.json:ro
    networks: [sunoflow-internal]

  # --- Nginx: edge proxy with rate limiting. HTTP only — the Cloudflare
  # tunnel terminates TLS upstream of this. Publishes 127.0.0.1:8081 only. ---
  nginx:
    image: nginx:1.27-alpine
    container_name: sunoflow-nginx
    restart: unless-stopped
    depends_on: [gateway]
    ports:
      - "127.0.0.1:8081:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [sunoflow-internal]

volumes:
  gateway-data:

networks:
  sunoflow-internal:
    driver: bridge
