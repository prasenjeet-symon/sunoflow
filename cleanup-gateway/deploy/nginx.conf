# SunoFlow cleanup gateway — Nginx config (docker-compose context)
#
# HTTP only. TLS is terminated by the Cloudflare tunnel upstream of this nginx,
# so no cert handling is needed here. Sits inside the sunoflow-internal network
# and proxies to the `gateway` service on :8080.
#
# Replace <operator-ip> in the /admin/ allowlist with your own IP (or remove
# the allow/deny block if you rely solely on the ADMIN_TOKEN).

# Coarse per-IP edge limit. The gateway adds the real per-key token bucket.
limit_req_zone $binary_remote_addr zone=edge:10m rate=30r/s;

upstream sunoflow_gateway {
    server gateway:8080;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 1m;
    add_header X-Content-Type-Options nosniff always;

    # Cloudflare pools one origin connection per edge node and reuses it for
    # whatever traffic that node sees. The median gap between one dictation and
    # the next is ~124s (measured against real traffic), so the default 75s
    # keepalive_timeout closes the origin connection between dictations and
    # every request after a quiet spell pays a fresh CF→origin TCP+TLS
    # handshake — ~250-350ms measured (cfOrigin 476ms cold vs 14ms warm),
    # sitting between the user's last word and their pasted text. 15 minutes
    # holds it across any realistic dictation gap; the gateway's own 120s
    # IdleTimeout does not make this unsafe (it only drops idle upstream
    # sockets, and nginx redials transparently).
    keepalive_timeout 15m;
    keepalive_requests 10000;

    # --- Admin endpoints: IP allowlist (v1) + ADMIN_TOKEN at the gateway. ---
    location /admin/ {
        # allow <operator-ip>;   # uncomment and set your IP to restrict
        # deny all;
        limit_req zone=edge burst=20 nodelay;
        proxy_pass http://sunoflow_gateway;
        proxy_http_version 1.1;      # required for upstream keepalive
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 30s;
    }

    # --- Suno Answer: streaming SSE. Buffers must stay off or chunks pile up
    # behind nginx and the answer renders all at once at the end; the read
    # timeout must clear the gateway's own 90s upstream deadline.
    location = /answer {
        client_max_body_size 4m;   # turn-1 screenshot rides the body (D2)
        limit_req zone=edge burst=20 nodelay;
        proxy_pass http://sunoflow_gateway;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_buffering off;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # --- Cloud STT (warm-start dictation). Bodies carry base64 audio up to
    # the gateway's own 12MB cap, so the 1m server default must be lifted
    # here or nginx 413s the request before the gateway sees it.
    location = /stt {
        client_max_body_size 14m;
        limit_req zone=edge burst=20 nodelay;
        proxy_pass http://sunoflow_gateway;
        proxy_http_version 1.1;      # required for upstream keepalive
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;   # clears the gateway's own STT_TIMEOUT (30s)
    }

    # --- Public API: /health, /ready, /cleanup ---
    location / {
        limit_req zone=edge burst=60 nodelay;
        proxy_pass http://sunoflow_gateway;
        proxy_http_version 1.1;      # required for upstream keepalive
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $request_id;
        proxy_read_timeout 60s;   # LLM calls can take a few seconds
    }
}